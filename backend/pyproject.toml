[project]
name = "dublaja-backend"
version = "0.1.0"
description = "Free game voice dubbing & TTS backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "gtts>=2.5.3",
    "deep-translator>=1.11.4",
    "SpeechRecognition>=3.10.4",
    "pydub>=0.25.1",
    "numpy>=1.26.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
